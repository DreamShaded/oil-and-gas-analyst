services:

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: oilgas-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oilgas-app
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      APP_HOST: 0.0.0.0
    ports:
      - "7860:7860"
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data:ro

volumes:
  qdrant-data:
