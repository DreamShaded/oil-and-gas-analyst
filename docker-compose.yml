services:

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: oilgas-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.25"
          memory: 256m
    mem_reservation: 256m
    cpus: 2.0
    mem_limit: 2g

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oilgas-app
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      APP_HOST: 0.0.0.0
    ports:
      - "7860:7860"
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    mem_reservation: 512m
    cpus: 2.0
    mem_limit: 2g

volumes:
  qdrant-data:
  app-data:
